<!doctype html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#fffdf9">
 <meta name="description" content="WISSENWELT – 600 Kreuzworträtsel, 189 Quizfragen und 150 Fakten. Drei Schwierigkeitsstufen und hilfreiche Erklärungen.">
 <link rel="manifest" href="manifest.webmanifest">
 <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
 <link rel="apple-touch-icon" href="assets/icon-192.png">
 <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="update.css">
 <title>WISSENWELT – Spielerisch lernen</title>
</head>
<body>
 <div id="app"></div>
 <noscript>Bitte aktiviere JavaScript, um WISSENWELT zu spielen.</noscript>
 <script type="module" src="app.js"></script>
 <script>
 if ('serviceWorker' in navigator) {
   let refreshing = false;
   navigator.serviceWorker.addEventListener('controllerchange', () => {
     if (refreshing || !navigator.serviceWorker.controller) return;
     refreshing = true;
     location.reload();
   });
   window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(registration => registration.update()).catch(() => {}));
 }
 </script>
</body>
</html>
